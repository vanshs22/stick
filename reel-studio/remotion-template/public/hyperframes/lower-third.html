<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:transparent}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Inter,system-ui,sans-serif}
  .clip{position:absolute;left:60px;right:60px;top:1180px}
  #bar{height:10px;width:0;background:#FFB547;border-radius:5px}
  #name{margin-top:18px;font-size:84px;font-weight:900;color:#fff;letter-spacing:-0.02em;text-shadow:0 6px 24px rgba(0,0,0,.5);opacity:0}
  #role{font-size:40px;color:#ffe9c9;opacity:0;margin-top:6px;text-shadow:0 4px 16px rgba(0,0,0,.5)}
</style></head><body>
<div id="stage" data-composition-id="lower-third" data-start="0" data-width="1080" data-height="1920" data-duration="3" data-fps="30">
  <div class="clip" id="c1" data-start="0" data-duration="3" data-track-index="0"><div id="bar"></div><div id="name">{{name}}</div><div id="role">{{role}}</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.to("#bar", { width: 260, duration: 0.5, ease: "power3.out" }, 0)
    .to("#name", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.25)
    .to("#role", { opacity: 1, duration: 0.4 }, 0.5)
    .to("#c1", { opacity: 0, duration: 0.4 }, 2.6);
  gsap.set("#name", { y: 30 });
  window.__timelines = window.__timelines || {}; window.__timelines["lower-third"] = tl;
</script></body></html>
